<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 스도쿠왕 쟁탈전 아이콘 원본. ?text=0 이면 글자 없는 판. 크롬으로 1024×1024 캡처해서 PNG를 만든다. -->
<link href="https://fonts.googleapis.com/css2?family=Jua&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:transparent}
svg{display:block}
</style></head><body>
<svg id="ic" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b4ee8"/><stop offset="1" stop-color="#3d2196"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff3c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".55" stop-color="#ffc21a"/><stop offset="1" stop-color="#e08a00"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a5f"/><stop offset="1" stop-color="#c8283a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1a0b4d" flood-opacity=".45"/></filter>
    <clipPath id="rr"><rect width="1024" height="1024" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#rr)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- 빛줄기 -->
    <g opacity=".12" fill="#fff" transform="translate(512 430)">
      <path d="M0 0 L-90 -620 L90 -620Z"/><path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(30)"/><path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(60)"/>
      <path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(90)"/><path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(120)"/><path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(150)"/>
      <path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(180)"/><path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(210)"/><path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(240)"/>
      <path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(270)"/><path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(300)"/><path d="M0 0 L-90 -620 L90 -620Z" transform="rotate(330)"/>
    </g>
    <rect width="1024" height="1024" fill="url(#glow)"/>
  </g>

  <!-- 3×3 땅따먹기 판 -->
  <g id="board" filter="url(#sh)">
    <rect x="232" y="300" width="560" height="560" rx="56" fill="#2b1d5c"/>
    <g font-family="Jua, 'Malgun Gothic', sans-serif" font-size="128" text-anchor="middle" fill="#2b2350">
      <!-- 칸: 180×180, 간격 10 -->
      <rect x="252" y="320" width="170" height="170" rx="26" fill="#7fb2ff"/><text x="337" y="450">5</text>
      <rect x="427" y="320" width="170" height="170" rx="26" fill="#7fb2ff"/><text x="512" y="450">3</text>
      <rect x="602" y="320" width="170" height="170" rx="26" fill="#ff93c4"/><text x="687" y="450">9</text>
      <rect x="252" y="495" width="170" height="170" rx="26" fill="#7fb2ff"/><text x="337" y="625">8</text>
      <rect x="427" y="495" width="170" height="170" rx="26" fill="#ffd54a"/>
      <rect x="445" y="513" width="134" height="134" rx="20" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="26 16"/>
      <rect x="602" y="495" width="170" height="170" rx="26" fill="#ff93c4"/><text x="687" y="625">2</text>
      <rect x="252" y="670" width="170" height="170" rx="26" fill="#ffe27a"/><text x="337" y="800">7</text>
      <rect x="427" y="670" width="170" height="170" rx="26" fill="#8fe39a"/><text x="512" y="800">1</text>
      <rect x="602" y="670" width="170" height="170" rx="26" fill="#8fe39a"/><text x="687" y="800">4</text>
    </g>
    <!-- 반짝 -->
    <g fill="#fff"><path d="M512 528 l10 36 36 10 -36 10 -10 36 -10 -36 -36 -10 36 -10z" opacity=".95"/></g>
  </g>

  <!-- 왕관 -->
  <g id="crown" filter="url(#sh)" transform="translate(512 222) scale(.72)">
    <path d="M-210 70 L-240 -120 L-110 -10 L0 -170 L110 -10 L240 -120 L210 70 Z" fill="url(#gold)" stroke="#b86a00" stroke-width="10" stroke-linejoin="round"/>
    <rect x="-220" y="60" width="440" height="64" rx="18" fill="url(#gold)" stroke="#b86a00" stroke-width="10"/>
    <circle cx="-240" cy="-128" r="26" fill="#ffe680" stroke="#b86a00" stroke-width="8"/>
    <circle cx="0" cy="-180" r="30" fill="#ffe680" stroke="#b86a00" stroke-width="8"/>
    <circle cx="240" cy="-128" r="26" fill="#ffe680" stroke="#b86a00" stroke-width="8"/>
    <circle cx="0" cy="18" r="34" fill="#e5484d" stroke="#fff" stroke-width="8"/>
    <circle cx="-120" cy="34" r="22" fill="#3b82f6" stroke="#fff" stroke-width="6"/>
    <circle cx="120" cy="34" r="22" fill="#3b82f6" stroke="#fff" stroke-width="6"/>
    <path d="M-180 -40 q30 -10 50 10" stroke="#fff8d6" stroke-width="12" fill="none" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- 리본 + 글자 -->
  <g id="label" filter="url(#sh)">
    <path d="M150 830 L230 830 L230 960 L190 930 L150 960 Z" fill="#a51f2f"/>
    <path d="M874 830 L794 830 L794 960 L834 930 L874 960 Z" fill="#a51f2f"/>
    <rect x="180" y="800" width="664" height="150" rx="36" fill="url(#ribbon)" stroke="#fff" stroke-width="10"/>
    <text x="512" y="910" text-anchor="middle" font-family="Jua, 'Malgun Gothic', sans-serif" font-size="112" fill="#fff" stroke="#7a1020" stroke-width="10" paint-order="stroke" letter-spacing="6">스도쿠왕</text>
  </g>
</svg>
<script>
  if(new URLSearchParams(location.search).get('text')==='0'){
    document.getElementById('label').remove();
    document.getElementById('board').setAttribute('transform','translate(0 40)');
    document.getElementById('crown').setAttribute("transform","translate(512 258) scale(.72)");
  }
</script>
</body></html>
